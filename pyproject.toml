[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kuruta-ids"
version = "0.3.5"
description = "Enterprise network security suite: Packet Sniffer, IDS, IPS active defense, and NAC asset control."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pywebview>=5.0,<6.0",
    "scapy>=2.5,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.28",
    "pillow>=10,<13",
    "pyinstaller>=6.10,<7.0",
    "pytest>=8.0,<9.0",
]

[project.scripts]
kuruta = "backend.run_app:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
