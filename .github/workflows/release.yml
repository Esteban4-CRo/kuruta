name: Kuruta Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} executables
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            rust-target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            platform: linux
            rust-target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Install Python service and bundler
        run: python -m pip install -e ".[dev]"
      - name: Run backend tests
        run: python -m pytest -q
      - name: Build native executables
        run: python scripts/build_release.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: kuruta-${{ matrix.platform }}-x64
          path: |
            dist/release/kuruta-server-${{ matrix.platform }}-x64*
            dist/release/kuruta-agent-${{ matrix.platform }}-x64*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kuruta-*-x64
          path: release-files
          merge-multiple: true
      - name: Include project logo and license
        run: |
          cp assets/kuruta-logo.png release-files/kuruta-logo.png
          cp LICENSE release-files/LICENSE-MIT.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/kuruta-*
            release-files/LICENSE-MIT.txt
