name: Kuruta CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packet capture libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run backend tests
        run: python -m pytest -q

  agent:
    name: Rust agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and test the agent
        run: cargo test --manifest-path agents/kuruta-agent/Cargo.toml
